      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
display:
  collapseCompacted: false
  showTokenUsage: true
tui:
  mouse: false
  imeSafeCursor: false
  tight: false
colorBlindMode: true
defaultThinkingLevel: low
setupVersion: 3
update:
  auto: false