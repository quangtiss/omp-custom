theme:
  dark: dark-github-user-highlight-custom
  light: light
symbolPreset: unicode
composer:
  shape: box
  tokenRate: false
computer:
  enabled: true
  display: active
  maxWidth: 3840
  maxHeight: 2400
extensions:
  - ~/.omp/agent/extensions/omniroute.ts
  - ~/.omp/agent/extensions/cli-anything
  - ~/.omp/sources/ponytail
modelRoles:
  default: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash-1017
  task: omniroute/kc/anthropic/claude-fable-5.1
  smol: omniroute/kc/anthropic/claude-haiku-4.5
  image: openrouter/google/gemini-3-pro-image
task:
  maxConcurrency: 4
  completionProbe: false
title:
  generator: tiny
recap:
  enabled: false
tools:
  approvalMode: yolo
git:
  enabled: true
statusLine:
  preset: default
  separator: powerline
  leftSegments:
    - vim
    - model
    - mode
    - path
    - pr
  compactThinkingLevel: false
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 200
      stripWorkPrefix: false
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
display:
  collapseCompacted: false
  showTokenUsage: true
tui:
  mouse: false
  imeSafeCursor: false
  tight: false
colorBlindMode: true
defaultThinkingLevel: low
setupVersion: 3
update:
  auto: false